; PlatformIO Project Configuration
; Monitoreo de Nivel de Cisterna
;
; https://docs.platformio.org/page/projectconf.html

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@7.4.1

; Development - debug output, USB upload
[env:cisterna_dev]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DDEBUG_LEVEL=2
upload_protocol = esptool

; Production - no debug, USB upload
[env:cisterna_prod]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DDEBUG_LEVEL=0
  -DCORE_DEBUG_LEVEL=0
upload_protocol = esptool

; Production OTA - subir firmware por WiFi (espota / ArduinoOTA).
; Ajusta upload_port para apuntar a otro equipo, y pasa --auth=<admin_pwd>
; en upload_flags (por CLI: pio run -e cisterna_ota -t upload --upload-flags "--auth=<pwd>").
[env:cisterna_ota]
extends = env:cisterna_prod
upload_protocol = espota
upload_port = 10.130.171.178
upload_flags =
  --auth=${sysenv.OTA_AUTH}
  --host_port=3232

; Native host tests - PlatformIO Test Runner with Unity
[env:native_test]
platform = native
test_build_src = false
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DUNIT_TEST
lib_deps =
  bblanchon/ArduinoJson@7.4.1
