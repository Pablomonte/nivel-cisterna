; PlatformIO Project Configuration
; Monitoreo de Nivel de Cisterna
;
; https://docs.platformio.org/page/projectconf.html

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@7.4.1

; Development - debug output, USB upload
[env:cisterna_dev]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DDEBUG_LEVEL=2
upload_protocol = esptool

; Production - no debug, USB upload
[env:cisterna_prod]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DDEBUG_LEVEL=0
  -DCORE_DEBUG_LEVEL=0
upload_protocol = esptool

; Production OTA - subir firmware por WiFi (espota / ArduinoOTA).
; Requiere OTA_TARGET_IP (IP del dispositivo) y OTA_AUTH (contraseña admin) en el entorno:
;   export OTA_TARGET_IP=<ip>  OTA_AUTH=<pwd>
;   pio run -e cisterna_ota -t upload
[env:cisterna_ota]
extends = env:cisterna_prod
upload_protocol = espota
upload_port = ${sysenv.OTA_TARGET_IP}
upload_flags =
  --auth=${sysenv.OTA_AUTH}
  --host_port=3232

; Dev OTA - mismo upload por WiFi pero con DEBUG_LEVEL=2 para ver logs por serial.
; Util para diagnosticar (portal cautivo, scan, etc.) sin tener que conectar USB.
[env:cisterna_dev_ota]
extends = env:cisterna_dev
upload_protocol = espota
upload_port = ${sysenv.OTA_TARGET_IP}
upload_flags =
  --auth=${sysenv.OTA_AUTH}
  --host_port=3232

; Native host tests - PlatformIO Test Runner with Unity
[env:native_test]
platform = native
test_build_src = false
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DUNIT_TEST
lib_deps =
  bblanchon/ArduinoJson@7.4.1
