; PlatformIO Project Configuration
; Monitoreo de Nivel de Cisterna
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@7.4.1

; Development - debug output, USB upload
[env:cisterna_dev]
build_flags =
  ${env.build_flags}
  -DDEBUG_LEVEL=2
upload_protocol = esptool

; Production - no debug, USB upload
[env:cisterna_prod]
build_flags =
  ${env.build_flags}
  -DDEBUG_LEVEL=0
  -DCORE_DEBUG_LEVEL=0
upload_protocol = esptool
