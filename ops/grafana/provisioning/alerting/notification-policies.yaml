apiVersion: 1

# Politica de ruteo: cualquier alerta con label kind in {level_low, level_high,
# sensor_fault, no_data} se envia al contact point telegram-cisterna.
# Si el contact point default ya cubre el caso, este archivo puede omitirse.

policies:
  - orgId: 4
    receiver: telegram-cisterna
    group_by: ["alertname", "device"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    matchers:
      - kind =~ "level_low|level_high|sensor_fault|no_data"
